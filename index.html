<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>FootyPredict - Football Predictions Dashboard | Live API Picks & Expert Analysis</title>
    <meta name="title" content="FootyPredict - Football Predictions Dashboard | Live API Picks & Expert Analysis" />
    <meta name="description" content="Get instant access to live RapidAPI football predictions, advanced market filters, and expert analysis. Premium access to unlimited picks, live alerts, and historical Betigolo data." />
    <meta name="keywords" content="football predictions, soccer predictions, betting tips, live picks, football analysis, prediction engine, sports betting" />
    <meta name="author" content="FootyPredict" />
    <meta name="language" content="English" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://footypredict.ai/" />
    <meta property="og:title" content="FootyPredict - Football Predictions Dashboard" />
    <meta property="og:description" content="Live RapidAPI football predictions with advanced market filters and expert analysis." />
    <meta property="og:site_name" content="FootyPredict" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://footypredict.ai/" />
    <meta name="twitter:title" content="FootyPredict - Football Predictions Dashboard" />
    <meta name="twitter:description" content="Live RapidAPI football predictions with advanced market filters and expert analysis." />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://footypredict.ai/" />

    <!-- Robots Meta Tag -->
    <meta name="robots" content="index, follow" />

    <!-- Sitemap & RSS -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "FootyPredict",
      "url": "https://footypredict.ai/",
      "description": "Live football predictions dashboard with expert analysis and premium picks."
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "FootyPredict",
      "url": "https://footypredict.ai/"
    }
    </script>

    <!-- Theme Color -->
    <meta name="theme-color" content="#3B82F6" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply persisted theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('footypredict.theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
